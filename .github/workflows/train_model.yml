name: Train Recommender Model

on:
  schedule:
    - cron: "0 2 * * 0"   # run every Sunday at 2:00 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Run trainer script
        run: |
          cd server/neurals
          python place_suggestor_trainer_model.py
